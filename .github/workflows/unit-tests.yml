name: "Offline unit tests"

# Budget metering, usage evidence and Vault credential tests. In-memory fakes only: no provider, Vault or
# budget service is contacted and no secrets are available to this job.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  offline-unit-tests:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: "Install test dependencies"
        run: python -m pip install "httpx==0.28.1" "cryptography==46.0.7" "requests==2.32.4"
      - name: "Budget metering tests"
        run: python -m unittest discover -s tests -p 'test_budget_*.py'
      - name: "Usage evidence tests"
        run: python -m unittest discover -s tests -p 'test_*usage*.py'
      - name: "Vault credential tests"
        run: python -m unittest discover -s tests -p 'test_research_credentials.py'
